name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build tools
        run: brew install llvm lld
      - name: Build Swift products
        run: swift build -c release
      - name: Native app checks without a game installation
        run: .build/release/MozaPaddock --self-test --without-game
      - name: Standalone runtime checks
        run: python3 Scripts/check-runtime.py
      - name: Archive installer checks
        run: python3 Scripts/check-paddock-mods.py
      - name: Bridge checks and Windows helper builds
        run: ./Scripts/check-ac-bridge.sh
      - name: Validate commit headers
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git log --format=%H "$BASE..HEAD" > /tmp/paddock-commits
          else
            git log --format=%H -1 > /tmp/paddock-commits
          fi
          while IFS= read -r commit; do
            git show -s --format=%B "$commit" | python3 Scripts/check-commit-message.py
          done < /tmp/paddock-commits
